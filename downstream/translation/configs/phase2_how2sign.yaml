# Phase 2 -- fine-tune Phase-1 model on How2Sign (SHuBERT § 4.2 Phase 2).

init_ckpt: runs/translation_phase1/ckpt_s250000.pt

data:
  feature_root: /path/to/features/how2sign
  manifest_jsonl: /path/to/how2sign_train.jsonl
  split: train
  num_workers: 4
  max_frames: 1024
  max_text_length: 384

fusion:
  streams: [lh, rh, face]
  in_dim: 384
  proj_dim: 256
  out_dim: 1472
  use_layer_weighted_sum: true
  n_layers: 7

model:
  backbone_id: google/byt5-base
  label_smoothing: 0.2
  max_gen_length: 384
  num_beams: 5
  length_penalty: 0.6

train:
  per_gpu_batch_size: 2
  grad_accum: 8
  total_steps: 50000
  warmup_steps: 5000
  lr_byt5: 1.0e-4
  lr_head: 1.0e-4
  weight_decay: 0.1
  amp: true
  log_every: 50
  ckpt_every: 2500
