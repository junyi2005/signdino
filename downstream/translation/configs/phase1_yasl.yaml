# Phase 1 -- pre-train translation on a large unlabelled-pair corpus
# (YouTube-ASL, mirroring SHuBERT § 4.2 Phase 1). Uses 250K steps with
# the larger lr; expects to be followed by Phase 2 on a benchmark.

init_ckpt: null              # no prior translation checkpoint

data:
  feature_root: /path/to/features/youtube_asl    # `extract_features.py --mode all_layers` output
  manifest_jsonl: /path/to/youtube_asl_train.jsonl
  split: train
  num_workers: 4
  max_frames: 1024
  max_text_length: 384

fusion:
  streams: [lh, rh, face]
  in_dim: 384
  proj_dim: 256
  out_dim: 1472                 # will be auto-overridden to ByT5.d_model at construction
  use_layer_weighted_sum: true
  n_layers: 7                   # temporal-encoder depth + 1 (post-norm)

model:
  backbone_id: google/byt5-base
  label_smoothing: 0.2
  max_gen_length: 384
  num_beams: 5
  length_penalty: 0.6

train:
  per_gpu_batch_size: 2
  grad_accum: 8                 # effective batch = 16 utterances
  total_steps: 250000
  warmup_steps: 10000
  lr_byt5: 5.0e-4
  lr_head: 5.0e-4               # fusion + projection trained at ByT5 lr
  weight_decay: 0.1
  amp: true
  log_every: 50
  ckpt_every: 5000
