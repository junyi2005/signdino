# Zero-shot evaluation on FLEURS-ASL (no fine-tuning; mirrors SHuBERT
# § 4.2 zero-shot setting). Use with `infer.py`, no training pass.

eval_only: true

ckpt: runs/translation_phase2_how2sign/ckpt_s50000.pt

data:
  feature_root: /path/to/features/fleurs_asl
  manifest_jsonl: /path/to/fleurs_asl_test.jsonl
  split: test
  max_frames: 1024

infer:
  batch_size: 4
  num_beams: 5
  max_length: 384
  out_hyps: runs/translation_phase2_how2sign/fleurs_test_hyps.jsonl
