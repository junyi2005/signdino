# Phase 2 fine-tune on How2Sign in LIVE mode --
# full fine-tune of SignDINO temporal encoders + ByT5 (DINOv3 stays frozen).
# Mirrors SHuBERT Table 7 "fine-tune" row (+2.8 BLEU vs frozen).

mode: live                                # 'live' | 'features'
init_ckpt: runs/translation_phase1_live/ckpt_s250000.pt    # phase-1 live ckpt

data:
  crop_root: /path/to/CROPS/how2sign         # YOLO+ByteTrack output, on-disk contract
  manifest_jsonl: /path/to/how2sign_train.jsonl
  split: train
  num_workers: 4
  max_frames: 512
  frame_stride: 2                            # subsample frames for speed
  max_text_length: 384

live:
  upstream_ckpts:                            # stream -> stage-2 SSL checkpoint
    lh:   runs/refine_lh/ckpt_e30.pt
    rh:   runs/refine_rh/ckpt_e30.pt
    face: runs/refine_face/ckpt_e30.pt
  dinov3_repo: /path/to/dinov3
  dinov3_model_name: dinov3_vitb16
  dinov3_input_size: 224
  dinov3_pretrained: true

fusion:
  streams: [lh, rh, face]
  in_dim: 384
  proj_dim: 256
  out_dim: 1472
  use_layer_weighted_sum: true
  n_layers: 7

model:
  backbone_id: google/byt5-base
  label_smoothing: 0.2
  max_gen_length: 384
  num_beams: 5
  length_penalty: 0.6

train:
  per_gpu_batch_size: 1                     # live mode is heavier; bump grad_accum instead
  grad_accum: 16                            # effective batch = 16
  total_steps: 50000
  warmup_steps: 5000
  lr_byt5: 1.0e-4
  lr_head: 1.0e-4
  lr_upstream: 1.0e-5                        # = lr_byt5 / 10 (SHuBERT § 4.2 protocol)
  weight_decay: 0.1
  amp: true
  log_every: 50
  ckpt_every: 2500
