# ISLR on ASL Citizen in LIVE mode -- SHuBERT § 4.3 protocol:
#   DINOv3 frozen + SignDINO encoders LoRA-rank-1 + BN + Linear head.
# 125 epochs, batch 128, Adam lr 1e-4 (head), 1e-5 (LoRA = head/10), wd 1e-4.

mode: live

data:
  crop_root: /path/to/CROPS/asl_citizen
  manifest_jsonl: /path/to/asl_citizen.jsonl
  num_workers: 4
  max_frames: 128
  frame_stride: 1

live:
  upstream_ckpts:
    lh:   runs/refine_lh/ckpt_e30.pt
    rh:   runs/refine_rh/ckpt_e30.pt
    face: runs/refine_face/ckpt_e30.pt
  dinov3_repo: /path/to/dinov3
  dinov3_model_name: dinov3_vitb16
  dinov3_input_size: 224
  dinov3_pretrained: true
  lora_rank: 1
  lora_alpha: 1.0

fusion:
  streams: [lh, rh, face]
  in_dim: 384
  proj_dim: 256
  out_dim: 768
  use_layer_weighted_sum: true
  n_layers: 7

model:
  label_smoothing: 0.1

train:
  batch_size: 32                          # live mode: smaller than 128 for memory
  epochs: 125
  lr_head: 1.0e-4
  lr_lora: 1.0e-5                          # = lr_head / 10  (SHuBERT § 4.3)
  weight_decay: 1.0e-4
  early_stop_patience: 10
