# ISLR on Sem-Lex (SHuBERT Table 2).

data:
  feature_root: /path/to/features/semlex
  manifest_jsonl: /path/to/semlex.jsonl
  num_workers: 4
  max_frames: 256

fusion:
  streams: [lh, rh, face]
  in_dim: 384
  proj_dim: 256
  out_dim: 768
  use_layer_weighted_sum: true
  n_layers: 7

model:
  label_smoothing: 0.1

train:
  batch_size: 128
  epochs: 125
  lr_head: 1.0e-4
  weight_decay: 1.0e-4
  early_stop_patience: 10
