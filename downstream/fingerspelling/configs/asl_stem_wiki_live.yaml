# Fingerspelling on ASL-Stem Wiki in LIVE mode -- SHuBERT § 4.4 protocol:
#   DINOv3 frozen + SignDINO encoders FULLY fine-tuned (no LoRA).
# Mirrors paper claim "by simply fine-tuning SHuBERT" yielding +42% IoU.

mode: live

data:
  crop_root: /path/to/CROPS/asl_stem_wiki
  manifest_jsonl: /path/to/asl_stem_wiki.jsonl
  num_workers: 4
  max_frames: 1024
  frame_stride: 1

live:
  upstream_ckpts:
    lh:   runs/refine_lh/ckpt_e30.pt
    rh:   runs/refine_rh/ckpt_e30.pt
    face: runs/refine_face/ckpt_e30.pt
  dinov3_repo: /path/to/dinov3
  dinov3_model_name: dinov3_vitb16
  dinov3_input_size: 224
  dinov3_pretrained: true

fusion:
  streams: [lh, rh, face]
  in_dim: 384
  proj_dim: 256
  out_dim: 512
  use_layer_weighted_sum: true
  n_layers: 7

model:
  hidden_depth: 2
  hidden_heads: 8
  hidden_dropout: 0.1
  pos_weight: 5.0

train:
  batch_size: 4                        # live mode: smaller for memory (long sequences)
  epochs: 60
  lr: 1.0e-4                            # head + projection + Transformer context
  lr_upstream: 1.0e-5                   # = lr / 10
  weight_decay: 1.0e-4
  early_stop_patience: 8

infer:
  threshold: 0.5
  min_len: 3
  smooth_kernel: 3
