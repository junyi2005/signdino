# Fingerspelling detection on ASL-Stem Wiki (SHuBERT Table 3).

data:
  feature_root: /path/to/features/asl_stem_wiki
  manifest_jsonl: /path/to/asl_stem_wiki.jsonl
  num_workers: 4
  max_frames: 1024

fusion:
  streams: [lh, rh, face]
  in_dim: 384
  proj_dim: 256
  out_dim: 512
  use_layer_weighted_sum: true
  n_layers: 7

model:
  hidden_depth: 2
  hidden_heads: 8
  hidden_dropout: 0.1
  pos_weight: 5.0

train:
  batch_size: 16
  epochs: 60
  lr: 1.0e-4
  weight_decay: 1.0e-4
  early_stop_patience: 8

infer:
  threshold: 0.5
  min_len: 3
  smooth_kernel: 3
