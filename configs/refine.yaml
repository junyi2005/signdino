# Stage 2 Gram-anchoring refinement (single stream).
# Requires a stage-1 checkpoint passed via --init-ckpt.
#   python train.py --config configs/refine.yaml --stream lh --exp-name refine_lh \
#                    --init-ckpt runs/pretrain_lh/ckpt_e100.pt

stage: refine
stream: lh
exp_name: refine_lh

data:
  crop_root: /path/to/workspace/SLRT/data/How2Sign/how2sign/sentence_level/CROPS
  split: train
  embedding_source: cache
  backbone_tag: dinov3_vitb16_224
  input_size: 224
  augment: true
  num_workers: 4
  pin_memory: true

multi_crop:
  n_global: 2
  n_local: 8
  # Windows are contiguous frames; length drawn uniformly from [min, max] per window.
  global_len_min: 64
  global_len_max: 96
  local_len_min: 10
  local_len_max: 32
  min_valid_frames: 4

ibot:
  mask_min: 0.25
  mask_max: 0.50

backbone:
  dinov3_repo: /path/to/dinov3
  model_name: dinov3_vitb16
  pretrained: true
  weights_path: null

model:
  in_dim: 768
  embed_dim: 384
  depth: 6
  num_heads: 6
  mlp_ratio: 4.0
  dropout: 0.0
  max_len: 256
  head_out_dim: 8192
  head_hidden: 2048
  head_bottleneck: 256
  head_layers: 3
  head_norm_last: true
  student_temp: 0.1
  teacher_temp: 0.07
  teacher_temp_start: 0.07               # no warmup in stage 2
  sinkhorn_iters: 3
  dino_weight: 1.0
  ibot_weight: 1.0
  dkoleo_weight: 0.1
  gram_weight: 2.0                       # stage 2: turn on Gram anchoring

train:
  batch_size: 16
  epochs: 30
  warmup_epochs: 1
  base_lr: 2.0e-4
  min_lr: 1.0e-6
  weight_decay: 0.04
  weight_decay_end: 0.4
  ema_momentum_start: 0.999
  ema_momentum_end: 1.0
  teacher_temp_warmup_epochs: 0
  grad_clip: 3.0
  amp: true
  log_every: 20
  ckpt_every: 1
  output_root: runs

seed: 0
